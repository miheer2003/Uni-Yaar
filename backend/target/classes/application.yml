server:
  port: 8080

spring:
  application:
    name: uniyaar-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/uniyaar_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

logging:
  level:
    com.uniyar: DEBUG
    org.hibernate.SQL: DEBUG

# JWT Configuration
app:
  jwt:
    secret: "uniyaar-super-secret-jwt-key-change-in-production-min-256-bits"
    expiration: 86400000 # 24 hours in milliseconds
